[project]
name = "ledmatrix"
version = "0.1.0"
description = "Modular display system for HUB75 LED panels on a Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "pillow",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psutil>=5.9",
]

[project.scripts]
ledmatrix = "ledmatrix.__main__:main"
ledmatrix-preview = "ledmatrix.__main__:preview"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"ledmatrix.web" = ["static/*"]
"ledmatrix" = ["assets/fonts/*"]