<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ledmatrix · preview</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #07080b;
    --panel: rgba(22, 24, 31, 0.72);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e8eaf0;
    --muted: #8a90a2;
    --accent: #4cc9f0;
    --live: #3ddc84;
    --warn: #ffb347;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 35%, #141822 0%, var(--bg) 70%);
    color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  header {
    position: fixed; inset: 16px 20px auto 20px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .brand { font-weight: 600; letter-spacing: 0.04em; }
  .brand span { color: var(--muted); font-weight: 400; }
  .chip {
    display: flex; gap: 10px; align-items: center;
    padding: 6px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(12px);
    color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .dot.live { background: var(--live); box-shadow: 0 0 10px var(--live); }

  main {
    position: fixed; inset: 0;
    display: grid; place-items: center;
  }
  .bezel {
    padding: 14px; border-radius: 14px;
    background: linear-gradient(180deg, #121419, #0a0b0e);
    border: 1px solid var(--line);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  canvas { display: block; border-radius: 4px; cursor: crosshair; }
  :fullscreen .bezel { padding: 0; border: 0; border-radius: 0; box-shadow: none; background: none; }

  .toolbar {
    position: fixed; left: 0; right: 0; bottom: 20px; margin: 0 auto; width: fit-content;
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 32px);
    padding: 10px 16px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    transition: opacity 0.25s, transform 0.25s;
  }
  .toolbar.hidden { opacity: 0; transform: translateY(20px); pointer-events: none; }
  .ctl { display: flex; gap: 8px; align-items: center; color: var(--muted); }
  .ctl output { color: var(--text); min-width: 34px; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 96px; accent-color: var(--accent); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  button {
    font: inherit; color: var(--text); cursor: pointer;
    background: transparent; border: 0; padding: 5px 10px;
  }
  .seg button.on { background: rgba(76, 201, 240, 0.18); color: var(--accent); }
  .btn { border: 1px solid var(--line); border-radius: 8px; }
  .btn:hover, .seg button:hover { background: rgba(255, 255, 255, 0.06); }
  .hint { position: fixed; left: 20px; top: 42px; color: var(--muted); font-size: 12px; }
  .hint kbd {
    font: inherit; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); background: rgba(255, 255, 255, 0.04);
  }
</style>
</head>
<body>
<header>
  <div class="brand">ledmatrix <span>· preview</span></div>
  <div class="chip">
    <div class="dot" id="dot"></div>
    <span id="status">connecting…</span>
    <span id="res"></span>
    <span id="fps"></span>
    <span id="pos"></span>
  </div>
</header>

<main><div class="bezel"><canvas id="screen"></canvas></div></main>

<div class="toolbar" id="toolbar">
  <div class="ctl">Size
    <div class="seg" id="fit">
      <button data-v="fit">Fit</button><button data-v="fixed">Fixed</button>
    </div>
    <input type="range" id="scale" min="2" max="24" step="1">
    <output id="scaleOut"></output>
  </div>
  <div class="ctl">LED
    <input type="range" id="dot_size" min="0.3" max="1" step="0.05">
    <output id="dotOut"></output>
  </div>
  <div class="ctl">Glow
    <input type="range" id="glow" min="0" max="1" step="0.05">
    <output id="glowOut"></output>
  </div>
  <div class="ctl">Shape
    <div class="seg" id="shape">
      <button data-v="round">●</button><button data-v="square">■</button>
    </div>
  </div>
  <div class="ctl">
    <div class="seg" id="unlit">
      <button data-v="on">Unlit LEDs</button>
    </div>
  </div>
  <button class="btn" id="snap">Screenshot</button>
  <button class="btn" id="full">Fullscreen</button>
</div>
<div class="hint"><kbd>F</kbd> fullscreen · <kbd>H</kbd> hide controls</div>

<script>
// ---------- settings (remembered in this browser) ----------
const defaults = { fit: true, scale: 8, dot: 0.8, glow: 0.55, shape: "round", unlit: true };
let cfg = { ...defaults };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("ledmatrix-preview") || "{}")); } catch {}
const save = () => { try { localStorage.setItem("ledmatrix-preview", JSON.stringify(cfg)); } catch {} };

// ---------- canvases ----------
const screen = document.getElementById("screen");
const ctx = screen.getContext("2d");
const src = document.createElement("canvas");   // 1 pixel per LED
const srcCtx = src.getContext("2d");
const led = document.createElement("canvas");   // lit LEDs, scaled
const ledCtx = led.getContext("2d");
const mask = document.createElement("canvas");  // LED shapes
const unlit = document.createElement("canvas"); // dark, unlit LEDs
let W = 0, H = 0, S = 1, image = null;

function currentScale() {
  if (!cfg.fit) return cfg.scale;
  const bar = document.getElementById("toolbar");
  const reserved = bar.classList.contains("hidden") ? 40 : bar.offsetHeight + 60;
  const room = Math.min((innerWidth - 80) / W, (innerHeight - 2 * reserved) / H);
  return Math.max(2, Math.floor(room));
}

function drawShapes(target, color) {
  const c = target.getContext("2d");
  c.clearRect(0, 0, target.width, target.height);
  c.fillStyle = color;
  const d = S * cfg.dot, off = (S - d) / 2;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (cfg.shape === "round") {
        c.beginPath();
        c.arc(x * S + S / 2, y * S + S / 2, d / 2, 0, Math.PI * 2);
        c.fill();
      } else {
        c.fillRect(x * S + off, y * S + off, d, d);
      }
    }
  }
}

function layout() {
  if (!W) return;
  S = currentScale();
  for (const c of [screen, led, mask, unlit]) { c.width = W * S; c.height = H * S; }
  drawShapes(mask, "#fff");
  drawShapes(unlit, "rgba(255,255,255,0.055)");
  document.getElementById("scaleOut").value = S + "px";
  draw();
}

function draw() {
  if (!W) return;
  // 1) lit LEDs: scale the frame up without smoothing, then cut out the LED shapes
  ledCtx.globalCompositeOperation = "source-over";
  ledCtx.clearRect(0, 0, led.width, led.height);
  ledCtx.imageSmoothingEnabled = false;
  ledCtx.drawImage(src, 0, 0, led.width, led.height);
  ledCtx.globalCompositeOperation = "destination-in";
  ledCtx.drawImage(mask, 0, 0);

  // 2) compose: background, unlit LEDs, lit LEDs, glow
  ctx.globalCompositeOperation = "source-over";
  ctx.filter = "none";
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#040506";
  ctx.fillRect(0, 0, screen.width, screen.height);
  if (cfg.unlit) ctx.drawImage(unlit, 0, 0);
  ctx.drawImage(led, 0, 0);
  if (cfg.glow > 0) {
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = cfg.glow;
    ctx.filter = `blur(${Math.max(1, S * 0.8)}px)`;
    ctx.drawImage(led, 0, 0);
    ctx.filter = "none";
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }
}

// ---------- incoming frames ----------
let frames = 0;
function onFrame(msg) {
  const sep = msg.indexOf(":");
  const [w, h] = msg.slice(0, sep).split("x").map(Number);
  if (w !== W || h !== H) {
    W = w; H = h;
    src.width = W; src.height = H;
    image = srcCtx.createImageData(W, H);
    document.getElementById("res").textContent = `${W}×${H}`;
    layout();
  }
  const bin = atob(msg.slice(sep + 1));
  const px = image.data;
  for (let i = 0, j = 0; i < bin.length; i += 3, j += 4) {
    px[j] = bin.charCodeAt(i);
    px[j + 1] = bin.charCodeAt(i + 1);
    px[j + 2] = bin.charCodeAt(i + 2);
    px[j + 3] = 255;
  }
  srcCtx.putImageData(image, 0, 0);
  draw();
  frames++;
}

function connect() {
  const dot = document.getElementById("dot");
  const status = document.getElementById("status");
  const es = new EventSource("/stream");
  es.onopen = () => { dot.classList.add("live"); status.textContent = "live"; };
  es.onmessage = (e) => onFrame(e.data);
  es.onerror = () => { dot.classList.remove("live"); status.textContent = "reconnecting…"; };
}

setInterval(() => {
  document.getElementById("fps").textContent = frames + " fps";
  frames = 0;
}, 1000);

// ---------- controls ----------
function bindRange(id, key, outId, fmt) {
  const el = document.getElementById(id), out = document.getElementById(outId);
  el.value = cfg[key];
  if (out) out.value = fmt(cfg[key]);
  el.oninput = () => {
    cfg[key] = Number(el.value);
    if (out) out.value = fmt(cfg[key]);
    if (key === "scale") { cfg.fit = false; syncSegs(); }
    save(); layout();
  };
}
bindRange("scale", "scale", null, (v) => v);
bindRange("dot_size", "dot", "dotOut", (v) => Math.round(v * 100) + "%");
bindRange("glow", "glow", "glowOut", (v) => Math.round(v * 100) + "%");

function syncSegs() {
  for (const b of document.querySelectorAll("#fit button")) b.classList.toggle("on", (b.dataset.v === "fit") === cfg.fit);
  for (const b of document.querySelectorAll("#shape button")) b.classList.toggle("on", b.dataset.v === cfg.shape);
  document.querySelector("#unlit button").classList.toggle("on", cfg.unlit);
}
document.getElementById("fit").onclick = (e) => {
  if (!e.target.dataset.v) return;
  cfg.fit = e.target.dataset.v === "fit"; save(); syncSegs(); layout();
};
document.getElementById("shape").onclick = (e) => {
  if (!e.target.dataset.v) return;
  cfg.shape = e.target.dataset.v; save(); syncSegs(); layout();
};
document.getElementById("unlit").onclick = () => { cfg.unlit = !cfg.unlit; save(); syncSegs(); draw(); };
syncSegs();

const toggleFull = () => document.fullscreenElement
  ? document.exitFullscreen()
  : document.documentElement.requestFullscreen();
document.getElementById("full").onclick = toggleFull;

document.getElementById("snap").onclick = () => {
  screen.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `ledmatrix-${new Date().toISOString().replace(/[:.]/g, "-")}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
};

addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") toggleFull();
  if (e.key === "h" || e.key === "H") {
    document.getElementById("toolbar").classList.toggle("hidden");
    layout();
  }
});
addEventListener("resize", () => { if (cfg.fit) layout(); });

// show the pixel under the mouse, handy when building modules
screen.addEventListener("mousemove", (e) => {
  const x = Math.floor(e.offsetX / S), y = Math.floor(e.offsetY / S);
  document.getElementById("pos").textContent = `x ${x} · y ${y}`;
});
screen.addEventListener("mouseleave", () => { document.getElementById("pos").textContent = ""; });

connect();
</script>
</body>
</html>
